<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validated Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    form {
      width: min(100% - 32px, 420px);
      padding: 28px;
      border: 1px solid #d6dde5;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgb(15 23 42 / 0.08);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    label {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
      font-size: 0.94rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #aab4c0;
      border-radius: 6px;
      font: inherit;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgb(37 99 235 / 0.16);
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 800;
      color: #ffffff;
      background: #16a34a;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #15803d;
    }

    button:active {
      transform: translateY(1px);
    }

    form:has(input:invalid) button {
      background: #9ca3af;
      color: #f3f4f6;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
    }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Registration</h1>

    <label>
      Name
      <input type="text" name="name" required placeholder="Your name">
    </label>

    <label>
      Email
      <input type="email" name="email" required placeholder="you@example.com">
    </label>

    <label>
      Age
      <input type="number" name="age" min="18" required placeholder="18">
    </label>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
