<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive Hero Card</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: light-dark(#eef2f7, #101218);
      --card-bg: light-dark(#ffffff, #191d27);
      --card-border: light-dark(#d8dee9, #2d3443);
      --title: light-dark(#121826, #f6f8fb);
      --body: light-dark(#4a5568, #c5cad6);
      --button-bg: light-dark(#2458d3, #8fb1ff);
      --button-text: light-dark(#fdfdff, #101525);
      --button-shadow: light-dark(rgb(36 88 211 / 0.28), rgb(143 177 255 / 0.22));
      --card-shadow: light-dark(rgb(15 23 42 / 0.16), rgb(0 0 0 / 0.32));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero-card {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
      box-shadow: 0 24px 70px var(--card-shadow);
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: 3rem;
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 20px 0 0;
      max-width: 46ch;
      color: var(--body);
      font-size: 1.125rem;
      line-height: 1.6;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 32px;
      padding: 0 22px;
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--button-text);
      box-shadow: 0 12px 28px var(--button-shadow);
      font-weight: 700;
      text-decoration: none;
    }

    .cta:focus-visible {
      outline: 3px solid var(--button-bg);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="hero-card">
    <h1>Design that follows your system</h1>
    <p>This card adapts its background, text, border, and button colors automatically when your operating system switches between light and dark mode.</p>
    <a class="cta" href="#">Get started</a>
  </main>
</body>
</html>
