<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive Hero Card</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: light-dark(#f4f0e8, #101820);
      --card-bg: light-dark(#fffaf0, #182633);
      --card-border: light-dark(#dfd3c3, #314455);
      --title: light-dark(#26332d, #f6ead7);
      --body: light-dark(#59635d, #bac6c0);
      --button-bg: light-dark(#2f6f64, #79d7c5);
      --button-text: light-dark(#ffffff, #0b1d20);
      --button-shadow: light-dark(#b9ccc3, #071013);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page-bg);
      color: var(--body);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero-card {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
      box-shadow: 0 24px 60px color-mix(in srgb, var(--button-shadow), transparent 72%);
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 24px 0 0;
      max-width: 42rem;
      font-size: clamp(1rem, 2vw, 1.125rem);
      line-height: 1.7;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 32px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--button-text);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 24px color-mix(in srgb, var(--button-shadow), transparent 68%);
    }

    .cta:focus-visible {
      outline: 3px solid var(--button-bg);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="hero-card">
    <h1>Design that follows the room.</h1>
    <p>This card uses system-aware color values that shift between calm daylight and focused night tones as soon as the operating system changes modes.</p>
    <a class="cta" href="#">Get Started</a>
  </main>
</body>
</html>
