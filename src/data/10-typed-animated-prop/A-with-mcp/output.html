<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trigger Glow</title>
  <style>
    @property --glow-color {
      syntax: "<color>";
      inherits: false;
      initial-value: #888;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(14, 165, 233, 0.08), transparent 34rem),
        #111318;
    }

    button {
      --glow-color: #888;
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--glow-color), white 20%);
      border-radius: 0.5rem;
      padding: 0.9rem 1.25rem;
      background: color-mix(in srgb, var(--glow-color), #111318 76%);
      color: white;
      font: 700 1rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow:
        0 0 0 0.18rem color-mix(in srgb, var(--glow-color), transparent 76%),
        0 0 2.25rem color-mix(in srgb, var(--glow-color), transparent 45%);
      text-shadow: 0 0 1rem color-mix(in srgb, var(--glow-color), transparent 35%);
      transition:
        --glow-color 800ms ease,
        transform 160ms ease;
    }

    button:hover,
    button.is-glowing {
      --glow-color: #0ea5e9;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }
  </style>
</head>
<body>
  <button type="button" id="trigger">Trigger glow</button>

  <script>
    const button = document.querySelector("#trigger");

    button.addEventListener("click", () => {
      button.classList.toggle("is-glowing");
    });
  </script>
</body>
</html>
