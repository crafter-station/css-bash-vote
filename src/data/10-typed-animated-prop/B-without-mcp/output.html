<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trigger Glow</title>
  <style>
    @property --glow-color {
      syntax: "<color>";
      inherits: false;
      initial-value: #888;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111827;
    }

    button {
      --glow-color: #888;
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--glow-color), white 18%);
      border-radius: 8px;
      padding: 0.85rem 1.15rem;
      background: linear-gradient(180deg, #1f2937, #111827);
      color: white;
      font: 700 1rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--glow-color), transparent 78%),
        0 0 34px 8px color-mix(in srgb, var(--glow-color), transparent 28%),
        inset 0 1px 0 rgb(255 255 255 / 0.12);
      transition:
        --glow-color 800ms ease,
        transform 160ms ease;
    }

    button:hover,
    button.is-glowing {
      --glow-color: #0ea5e9;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <button type="button">Trigger glow</button>

  <script>
    const button = document.querySelector("button");

    button.addEventListener("click", () => {
      button.classList.toggle("is-glowing");
    });
  </script>
</body>
</html>
