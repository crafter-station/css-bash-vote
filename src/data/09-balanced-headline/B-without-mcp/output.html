<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balanced Headline Hero</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #17201a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(35, 98, 70, 0.12), transparent 45%),
        linear-gradient(315deg, rgba(177, 82, 42, 0.14), transparent 42%),
        #f7f4ee;
    }

    .hero {
      width: min(100% - 48px, 960px);
      min-height: 520px;
      display: grid;
      place-items: center;
      padding: 72px 24px;
      text-align: center;
    }

    h1 {
      width: min(500px, 100%);
      margin: 0;
      font-size: clamp(2.75rem, 7vw, 4.75rem);
      line-height: 1.02;
      font-weight: 820;
      letter-spacing: 0;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Design calmer product launches with sharper stories and better sustained team momentum</h1>
  </main>
</body>
</html>
