<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balanced Headline Hero</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(22, 68, 92, 0.12), transparent 36rem),
        linear-gradient(315deg, rgba(173, 91, 70, 0.14), transparent 34rem),
        #f7f4ee;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px;
    }

    h1 {
      width: 500px;
      margin: 0;
      font-size: 56px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: 0;
      text-align: center;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Design clearer product stories that turn complex ideas into confident customer decisions</h1>
  </main>
</body>
</html>
