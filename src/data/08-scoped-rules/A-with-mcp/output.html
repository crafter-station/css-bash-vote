<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoped CSS Boundary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 24px;
      padding: 32px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
    }

    main {
      width: min(100%, 760px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 20px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      background: #ffffff;
    }

    .preview {
      margin-top: 16px;
      padding: 14px;
      border: 1px dashed #a1a1aa;
      border-radius: 6px;
      background: #fafafa;
    }

    p {
      color: red;
    }

    @scope (.scoped) to (.preview) {
      p {
        color: black;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h2>Regular card</h2>
      <p>This paragraph follows the global red paragraph rule.</p>
      <div class="preview">
        <p>This preview paragraph also follows the global red rule.</p>
      </div>
    </section>

    <section class="card scoped">
      <h2>Scoped card</h2>
      <p>This paragraph stays black inside the scoped card.</p>
      <div class="preview">
        <p>This paragraph is red again because preview is the lower boundary.</p>
      </div>
    </section>
  </main>
</body>
</html>
