<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick note</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f2ee;
      color: #202124;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-block-size: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .note-field {
      inline-size: min(100%, 520px);
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.3;
    }

    textarea {
      inline-size: 100%;
      min-block-size: calc(1lh + 22px);
      padding: 10px 12px;
      border: 1px solid #8d948f;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
      line-height: 1.45;
      resize: none;
      overflow: hidden;
      field-sizing: content;
    }

    textarea:focus {
      border-color: #0f6b5f;
      outline: 3px solid color-mix(in srgb, #0f6b5f 24%, transparent);
      outline-offset: 2px;
    }

    textarea::placeholder {
      color: #747a76;
    }
  </style>
</head>
<body>
  <div class="note-field">
    <label for="quick-note">Quick note</label>
    <textarea id="quick-note" name="quick-note" placeholder="Write a quick note"></textarea>
  </div>
</body>
</html>
